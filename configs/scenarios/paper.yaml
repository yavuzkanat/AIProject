# Transcription of the benchmark scenarios of Li et al., Drones 2026, 10(6), 467.
# Sources: §5.1.1 (airspace, lambdas), Table 3 (UAVs), Table 4 (targets),
# Table 5 (dynamic events), §5.1.3 (initial preference).
# The `scenarios` column is copied from the paper's "Involved Scenarios" column.
# Interpretations of ambiguous entries are documented in docs/assumptions.md.

name: paper
variants: [S1, S2, S3]

airspace: [8000.0, 8000.0, 200.0]   # m (§5.1.1)
lambda_obse: 0.001                  # 1/s (§5.1.1)
lambda_risk: 0.0002                 # 1/m (§5.1.1)
initial_weather: {VL: 1.0, IR: 1.0, RD: 1.0}   # not stated in the paper (gap G3)
initial_preference: [0.5, 0.5]      # §5.1.3

uav_types:                          # Table 3
  A: {speed: 15.0, endurance: 1800.0, sensors: {VL: 1, IR: 1, RD: 0}, vulnerability: 0.9}
  B: {speed: 15.0, endurance: 2400.0, sensors: {VL: 1, IR: 1, RD: 1}, vulnerability: 1.0}

